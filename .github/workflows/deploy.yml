name: CloudShop CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463984225717:role/cloudshop-github-actions-role
          aws-region: us-east-1


      - name: Verify AWS identity
        run: aws sts get-caller-identity


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build backend image
        run: |
          docker build -t cloudshop-backend:${{ github.sha }} ./backend

          docker tag cloudshop-backend:${{ github.sha }} \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}


      - name: Push backend image
        run: |
          docker push \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}


      - name: Build frontend image
        run: |
          docker build -t cloudshop-frontend:${{ github.sha }} ./frontend

          docker tag cloudshop-frontend:${{ github.sha }} \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}


      - name: Push frontend image
        run: |
          docker push \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}


      - name: Package production configuration
        run: |
          tar -czf cloudshop-production.tar.gz \
            docker-compose.prod.yml \
            infra/monitoring


      - name: Upload configuration to S3
        run: |
          aws s3 cp cloudshop-production.tar.gz \
            s3://cloudshop-deploy-config/cloudshop-production.tar.gz


      - name: Deploy to EC2 with SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-038853917277cf32a" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudShop commit ${{ github.sha }}" \
            --parameters 'commands=[

              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 463984225717.dkr.ecr.us-east-1.amazonaws.com",

              "rm -rf /home/ec2-user/cloudshop-production",

              "mkdir -p /home/ec2-user/cloudshop-production",

              "aws s3 cp s3://cloudshop-deploy-config/cloudshop-production.tar.gz /home/ec2-user/cloudshop-production/",

              "tar -xzf /home/ec2-user/cloudshop-production/cloudshop-production.tar.gz -C /home/ec2-user/cloudshop-production",

              "export TAG=${{ github.sha }}",

              "export DATABASE_URL=$(aws ssm get-parameter --name /cloudshop/dev/database_url --with-decryption --region us-east-1 --query Parameter.Value --output text)",

              "cd /home/ec2-user/cloudshop-production",

              "docker compose -f docker-compose.prod.yml down || true",
               
               docker system prune -af 
              "docker compose -f docker-compose.prod.yml pull",

              "docker compose -f docker-compose.prod.yml up -d"

            ]' \
            --query "Command.CommandId" \
            --output text)


          echo "Command ID: $COMMAND_ID"


          echo "Waiting for SSM execution..."


          for i in {1..60}
          do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-038853917277cf32a" \
              --query "Status" \
              --output text)


            echo "Current SSM status: $STATUS"


            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully"
              break
            fi


            if [ "$STATUS" = "Failed" ]; then

              echo "Deployment failed"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-038853917277cf32a"

              exit 1

            fi


            sleep 10

          done


          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-038853917277cf32a"