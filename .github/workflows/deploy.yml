name: CloudShop CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463984225717:role/cloudshop-github-actions-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build -t cloudshop-backend:${{ github.sha }} ./backend
          docker tag cloudshop-backend:${{ github.sha }} \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}

      - name: Build frontend image
        run: |
          docker build -t cloudshop-frontend:${{ github.sha }} ./frontend
          docker tag cloudshop-frontend:${{ github.sha }} \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}

      - name: Prepare production files on EC2
        run: |
          COMPOSE_CONTENT=$(base64 -w 0 docker-compose.prod.yml)
          ALLOY_CONTENT=$(base64 -w 0 infra/monitoring/alloy-config.alloy)
          LOKI_CONTENT=$(base64 -w 0 infra/monitoring/loki-config.yml)
          PROM_CONTENT=$(base64 -w 0 infra/monitoring/prometheus.yml)

          aws ssm send-command \
            --instance-ids "i-038853917277cf32a" \
            --document-name "AWS-RunShellScript" \
            --comment "Upload CloudShop production configuration" \
            --parameters "commands=[
              \"mkdir -p /home/ec2-user/infra/monitoring\",
              \"echo $COMPOSE_CONTENT | base64 -d > /home/ec2-user/docker-compose.prod.yml\",
              \"echo $ALLOY_CONTENT | base64 -d > /home/ec2-user/infra/monitoring/alloy-config.alloy\",
              \"echo $LOKI_CONTENT | base64 -d > /home/ec2-user/infra/monitoring/loki-config.yml\",
              \"echo $PROM_CONTENT | base64 -d > /home/ec2-user/infra/monitoring/prometheus.yml\",
              \"chown -R ec2-user:ec2-user /home/ec2-user/infra\"
            ]"

      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-038853917277cf32a" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudShop commit ${{ github.sha }}" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 463984225717.dkr.ecr.us-east-1.amazonaws.com",

              "export TAG=${{ github.sha }}",

              "export DATABASE_URL=$(aws ssm get-parameter --name /cloudshop/dev/database_url --with-decryption --region us-east-1 --query Parameter.Value --output text)",

              "docker compose -f /home/ec2-user/docker-compose.prod.yml down || true",

              "docker compose -f /home/ec2-user/docker-compose.prod.yml pull",

              "docker compose -f /home/ec2-user/docker-compose.prod.yml up -d"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-038853917277cf32a"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-038853917277cf32a"