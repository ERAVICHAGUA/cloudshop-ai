name: CloudShop CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463984225717:role/cloudshop-github-actions-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build -t cloudshop-backend:${{ github.sha }} ./backend
          docker tag cloudshop-backend:${{ github.sha }} \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}

      - name: Build frontend image
        run: |
          docker build -t cloudshop-frontend:${{ github.sha }} ./frontend
          docker tag cloudshop-frontend:${{ github.sha }} \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}

      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-038853917277cf32a" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudShop commit ${{ github.sha }}" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 463984225717.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}",
              "docker pull 463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}",
              "docker rm -f cloudshop-backend || true",
              "docker rm -f cloudshop-frontend || true",
              "DATABASE_URL=$(aws ssm get-parameter --name /cloudshop/dev/database_url --with-decryption --region us-east-1 --query Parameter.Value --output text)",
              "docker run -d --name cloudshop-backend --network cloudshop-network -p 8000:8000 -e DATABASE_URL=\"$DATABASE_URL\" --log-driver=awslogs --log-opt awslogs-region=us-east-1 --log-opt awslogs-group=/cloudshop/backend --log-opt awslogs-stream=cloudshop-backend 463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-backend:${{ github.sha }}",
              "docker run -d --name cloudshop-frontend --network cloudshop-network -p 80:80 --log-driver=awslogs --log-opt awslogs-region=us-east-1 --log-opt awslogs-group=/cloudshop/frontend --log-opt awslogs-stream=cloudshop-frontend 463984225717.dkr.ecr.us-east-1.amazonaws.com/cloudshop-frontend:${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-038853917277cf32a"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-038853917277cf32a"