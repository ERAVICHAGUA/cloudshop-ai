services:
  backend:
    build:
      context: ./backend
    container_name: cloudshop-backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://cloudshop:cloudshop123@postgres:5432/cloudshop
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: cloudshop-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: cloudshop-postgres
    environment:
      POSTGRES_USER: cloudshop
      POSTGRES_PASSWORD: cloudshop123
      POSTGRES_DB: cloudshop
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: cloudshop-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_USER}"
      GF_SMTP_FROM_NAME: "CloudShop Grafana"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.5.9
    container_name: cloudshop-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: cloudshop-alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data: